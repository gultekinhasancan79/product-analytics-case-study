name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analytics-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Generate deterministic user experiment data
        run: python -m src.generate_dataset

      - name: Generate deterministic event fact data
        run: python -m src.generate_events

      - name: Run user and event data-quality gates
        run: python -m src.data_quality

      - name: Smoke-test experiment power planner
        run: >-
          python -m src.power
          --baseline 0.5116201859
          --n-control 6024
          --n-treatment 5976
          --effect 0.0213450082

      - name: Smoke-test CUPED sensitivity analysis
        run: python -m src.cuped

      - name: Execute reviewer notebook walkthrough
        run: python -m src.execute_notebook

      - name: Regenerate statistical readout
        run: python -m src.experiment --output artifacts/experiment_summary.md

      - name: Verify committed experiment report is reproducible
        run: diff -u reports/experiment_summary.md artifacts/experiment_summary.md

      - name: Regenerate robust revenue readout
        run: python -m src.revenue_robust --output artifacts/revenue_robustness.md

      - name: Verify committed revenue report is reproducible
        run: diff -u reports/revenue_robustness.md artifacts/revenue_robustness.md

      - name: Regenerate sequential simulation
        run: python -m src.sequential --output artifacts/sequential_peeking.md

      - name: Verify sequential simulation report
        run: diff -u reports/sequential_peeking.md artifacts/sequential_peeking.md

      - name: Regenerate exposure assignment demo
        run: python -m src.exposure_demo --output artifacts/exposure_itt_tot.md

      - name: Verify exposure assignment report
        run: diff -u reports/exposure_itt_tot.md artifacts/exposure_itt_tot.md

      - name: Execute analytical SQL
        run: python -m src.run_sql > artifacts/sql_output.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
