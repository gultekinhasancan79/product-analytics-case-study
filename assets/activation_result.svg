  <text x="36" y="68" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Guided onboarding checklist experiment</text>

  <text x="36" y="122" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#24292f">Control</text>
  <rect x="150" y="100" width="460" height="30" rx="6" fill="#eaeef2"/>
  <rect x="150" y="100" width="392" height="30" rx="6" fill="#8c959f"/>
